<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Жанры</title>
        <link rel="stylesheet" th:href="@{/css/style.css}" />
    </head>
    <body>
        <nav aria-label="Навигация">
            <a th:href="@{/books}">Книги</a>
            <a th:href="@{/authors}">Авторы</a>
            <a th:href="@{/genres}">Жанры</a>
        </nav>

        <main>
            <h1>Жанры</h1>

            <p class="empty-state" th:if="${#lists.isEmpty(genres)}">
                Жанров пока нет.
            </p>

            <div class="table-wrap" th:unless="${#lists.isEmpty(genres)}">
                <table>
                    <thead>
                        <tr>
                            <th scope="col">Название жанра</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr th:each="genre : ${genres}">
                            <td th:text="${genre.name}">Название жанра</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </body>
</html>
