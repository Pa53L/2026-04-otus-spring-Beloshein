<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Каталог книг</title>
        <link rel="stylesheet" th:href="@{/css/style.css}" />
    </head>
    <body>
        <nav aria-label="Навигация">
            <a th:href="@{/books}">Книги</a>
            <a th:href="@{/authors}">Авторы</a>
            <a th:href="@{/genres}">Жанры</a>
        </nav>

        <main>
            <h1>Каталог книг</h1>

            <div class="page-actions">
                <a class="button-link" th:href="@{/books/new}">
                    Добавить книгу
                </a>
            </div>

            <p class="empty-state" th:if="${#lists.isEmpty(books)}">
                В каталоге пока нет книг.
            </p>

            <div class="table-wrap" th:unless="${#lists.isEmpty(books)}">
                <table>
                    <thead>
                        <tr>
                            <th>Название</th>
                            <th>Автор</th>
                            <th>Жанры</th>
                            <th>Действия</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr th:each="book : ${books}">
                            <td>
                                <a
                                    th:href="@{/books/{id}(id=${book.id})}"
                                    th:text="${book.title}"
                                >
                                    Название книги
                                </a>
                            </td>

                            <td th:text="${book.author.fullName}">
                                Имя автора
                            </td>

                            <td>
                                <span th:each="genre, status : ${book.genres}">
                                    <span th:text="${genre.name}">Жанр</span
                                    ><span th:unless="${status.last}">, </span>
                                </span>
                            </td>

                            <td>
                                <div class="row-actions">
                                    <a
                                        th:href="@{/books/{id}/edit(id=${book.id})}"
                                    >
                                        Редактировать
                                    </a>

                                    <form
                                        th:action="@{/books/{id}/delete(id=${book.id})}"
                                        method="post"
                                    >
                                        <button
                                            class="button-danger"
                                            type="submit"
                                        >
                                            Удалить
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </body>
</html>
